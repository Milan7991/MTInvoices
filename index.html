<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maruti Invoice Maker</title>
<meta name="theme-color" content="#2B4F8F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<style>
:root{
  --bg:#EEF1F5; --panel:#FFFFFF; --ink:#18202C; --muted:#5E6878; --line:#D8DEE7; --field:#F6F8FB;
  --blue:#2B4F8F; --blue-soft:#E3EAF6; --danger:#B3261E; --ok:#1E7A4C;
  --r5:#3F8F5A; --r12:#C9971A; --r18:#2B4F8F; --r28:#A8342F; --r0:#7A8494;
  --radius:10px;
  font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161D; --panel:#1B212B; --ink:#E7EBF1; --muted:#9AA4B4; --line:#2E3746; --field:#232A36;
  --blue:#7FA4E6; --blue-soft:#24324A; --danger:#F08A82; --ok:#6CCB97;
}}
:root[data-theme="dark"]{--bg:#12161D; --panel:#1B212B; --ink:#E7EBF1; --muted:#9AA4B4; --line:#2E3746; --field:#232A36; --blue:#7FA4E6; --blue-soft:#24324A; --danger:#F08A82; --ok:#6CCB97;}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* Top bar */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.swatch-stack{display:grid;grid-template-columns:repeat(2,9px);gap:2px}
.swatch-stack i{width:9px;height:9px;border-radius:2px;display:block}
.brand h1{font-family:"Bricolage Grotesque",sans-serif;font-size:19px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0E1522}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0E1522}}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--danger)}
.btn svg{width:16px;height:16px}

/* Layout */
.app{display:grid;grid-template-columns:minmax(360px,520px) 1fr;gap:20px;padding:20px;max-width:1440px;margin:0 auto}
.editor{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h2{font-family:"Bricolage Grotesque",sans-serif;font-size:16px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.f input,.f textarea,.f select,.it input,.it select{background:var(--field);border:1px solid var(--line);border-radius:7px;padding:9px 10px;width:100%;min-width:0;font-size:15px}
.f textarea{resize:vertical;min-height:62px}
.f input:focus,.f textarea:focus,.it input:focus,.it select:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
.hint{font-size:12px;color:var(--muted);margin-top:2px}
.hint.warn{color:var(--danger)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.toggle input{width:18px;height:18px;accent-color:var(--blue)}
.row-flex{display:flex;flex-wrap:wrap;gap:14px 20px;margin-top:12px}

/* Items */
.items{display:flex;flex-direction:column;gap:10px}
.it{border:1px solid var(--line);border-left:5px solid var(--r0);border-radius:8px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--panel)}
.it .name{grid-column:1/-1;display:flex;gap:8px}
.it .rates{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.it small{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.chip{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.it .line-amt{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.icon-btn{border:none;background:transparent;cursor:pointer;color:var(--muted);padding:6px;border-radius:6px;display:inline-flex}
.icon-btn:hover{color:var(--danger);background:var(--field)}
.icon-btn svg{width:18px;height:18px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.quick .chip{font-weight:500}
.add-row{margin-top:10px;width:100%;justify-content:center;border-style:dashed}

/* Totals strip */
.totals{display:flex;align-items:center;gap:12px}
.totals .big{font-family:"Bricolage Grotesque",sans-serif;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.totals .sub{font-size:13px;color:var(--muted)}

/* Preview */
.preview{min-width:0}
.preview-inner{position:sticky;top:76px}
.sheet-wrap{overflow:hidden}
.pages{width:794px;transform-origin:top left;display:flex;flex-direction:column;gap:24px}
.sheet{width:794px;height:1123px;overflow:hidden;background:#fff;color:#141414;box-shadow:0 1px 2px rgba(20,30,50,.08),0 8px 30px rgba(20,30,50,.12);padding:40px 44px;position:relative;font-family:"Instrument Sans",Arial,sans-serif;font-size:13px;line-height:1.45;font-variant-numeric:tabular-nums}
.mtabs{display:none}

/* Invoice styles */
.inv-stripe{display:flex;height:6px;margin:-40px -44px 28px}
.inv-stripe i{flex:1}
.inv-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;font-size:12px}
.inv-top .c{text-align:center}
.inv-top .r{text-align:right}
.inv-title{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:22px;letter-spacing:.06em;color:#1F3A6B}
.inv-meta{display:flex;justify-content:space-between;margin-top:10px;font-size:13px}
.inv-parties{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:22px;padding:18px 0;border-top:1.5px solid #1F3A6B;border-bottom:1px solid #DADDE3}
.shop-name{font-family:"Bricolage Grotesque",sans-serif;font-size:21px;font-weight:700;color:#1F3A6B;line-height:1.15}
.shop-tag{font-size:12px;font-weight:600;color:#555;margin-bottom:6px}
.lbl{font-size:11px;font-weight:700;color:#1F3A6B;margin-bottom:4px}
.cust-name{font-size:16px;font-weight:700}
.bank{margin-top:10px;padding:8px 10px;background:#F3F5F9;border-radius:6px;font-size:12px;display:inline-block}
.inv-table{width:100%;border-collapse:collapse;margin-top:20px}
.inv-table th{background:#1F3A6B;color:#fff;font-weight:600;font-size:12px;padding:8px 8px;text-align:left}
.inv-table th.n,.inv-table td.n{text-align:right}
.inv-table td{padding:9px 8px;border-bottom:1px solid #E4E7EC;vertical-align:top}
.inv-table tr:nth-child(even) td{background:#FAFBFC}
.rate-dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.inv-bottom{display:grid;grid-template-columns:1fr 300px;gap:24px;margin-top:16px}
.sum{width:100%;border-collapse:collapse}
.sum td{padding:5px 8px}
.sum td.n{text-align:right}
.sum .grand td{border-top:2px solid #1F3A6B;font-size:17px;font-weight:700;padding-top:9px;color:#1F3A6B}
.sum .muted td{color:#666;font-size:12px}
.words{font-size:12px;margin-top:4px;padding:8px 10px;border-left:3px solid #1F3A6B;background:#F3F5F9}
.notes{margin-top:14px;font-size:12px}
.inv-mini{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:16px;padding-bottom:12px;border-bottom:1.5px solid #1F3A6B;font-size:12px}
.inv-mini .c{text-align:center}
.inv-mini .r{text-align:right;line-height:1.6}
.mini-sub{font-size:11.5px;color:#666}
.cont{margin-top:10px;text-align:right;font-size:12px;font-style:italic;color:#666}
.notes h4{margin:0 0 6px;font-size:13px;color:#1F3A6B}
.notes ul{margin:0;padding-left:18px}
.qr{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:11.5px}
.qr img,.qr canvas{width:92px!important;height:92px!important}
.stamp{position:absolute;right:70px;bottom:150px;transform:rotate(-12deg);border:3px solid #1E7A4C;color:#1E7A4C;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:30px;padding:4px 16px;border-radius:8px;opacity:.75;letter-spacing:.08em}
.inv-foot{position:absolute;left:44px;right:44px;bottom:28px;font-size:11px;color:#777;display:flex;justify-content:space-between;gap:12px;border-top:1px solid #E4E7EC;padding-top:8px}

/* Dialogs */
dialog{border:none;border-radius:14px;padding:0;background:var(--panel);color:var(--ink);width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,15,25,.45)}
.dlg-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.dlg-head h3{margin:0;font-family:"Bricolage Grotesque",sans-serif;font-size:18px}
.dlg-body{padding:18px;display:flex;flex-direction:column;gap:14px}
.hist-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.hist-row{display:grid;grid-template-columns:80px 1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.hist-row:last-child{border-bottom:none}
.hist-row .amt{font-weight:700;font-variant-numeric:tabular-nums}
.hist-row .who{min-width:0}
.hist-row .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-row .who span{font-size:12px;color:var(--muted)}
.hist-actions{display:flex;gap:4px}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--field);color:var(--muted)}
.pill.paid{background:rgba(30,122,76,.14);color:var(--ok)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.month{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--field);border-radius:8px;padding:10px}
.stat span{font-size:12px;color:var(--muted);display:block}
.stat b{font-variant-numeric:tabular-nums;font-size:16px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.mobile-bar{display:none}

@media (max-width:900px){
  .app{grid-template-columns:1fr;padding:12px 16px 96px}
  .bar .hide-sm{display:none}
  .mtabs{display:flex;gap:4px;background:var(--field);padding:4px;border-radius:9px;border:1px solid var(--line)}
  .mtabs button{flex:1;border:none;background:transparent;padding:8px;border-radius:6px;font-weight:600;cursor:pointer}
  .mtabs button[aria-selected="true"]{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.1)}
  body:not(.show-preview) .preview{display:none}
  body.show-preview .editor > :not(.mtabs){display:none}
  .preview-inner{position:static}
  .mobile-bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));align-items:center;gap:8px}
  .mobile-bar .totals{margin-right:auto}
  .mobile-bar .big{font-size:22px}
  .hist-row{grid-template-columns:1fr auto;}
  .hist-row .no{grid-column:1/-1;font-size:12px;color:var(--muted)}
}
@media (max-width:420px){ .grid2{grid-template-columns:1fr} .brand h1{font-size:17px} }
body.measuring .preview{display:block!important;position:absolute;left:-10000px;top:0;visibility:hidden}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .bar,.editor,.mobile-bar,.toast,dialog{display:none!important}
  .app{display:block;padding:0;margin:0;max-width:none}
  .preview{display:block!important}
  .preview-inner{position:static}
  .sheet-wrap{height:auto!important;overflow:visible}
  .pages{transform:none!important;display:block}
  .sheet{box-shadow:none;width:210mm;height:297mm;overflow:hidden;break-after:page}
  .sheet:last-child{break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<header class="bar">
  <div class="brand">
    <div class="swatch-stack" aria-hidden="true"><i style="background:var(--r5)"></i><i style="background:var(--r12)"></i><i style="background:var(--r18)"></i><i style="background:var(--r28)"></i></div>
    <h1 id="brandName">Invoice Maker</h1>
  </div>
  <button class="btn ghost" id="bNew" title="Start a new invoice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><span class="hide-sm">New</span></button>
  <button class="btn ghost" id="bReset" title="Clear everything on this invoice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/></svg><span class="hide-sm">Reset</span></button>
  <button class="btn ghost" id="bHist" title="Saved invoices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg><span class="hide-sm">History</span></button>
  <button class="btn ghost" id="bSet" title="Shop settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span class="hide-sm">Settings</span></button>
  <button class="btn hide-sm" id="bWa">WhatsApp</button>
  <button class="btn hide-sm" id="bSave">Save</button>
  <button class="btn primary hide-sm" id="bPrint">Print / PDF</button>
</header>

<main class="app">
  <section class="editor">
    <div class="mtabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="edit">Edit</button>
      <button role="tab" aria-selected="false" data-tab="preview">Preview</button>
    </div>

    <div class="card">
      <h2>Invoice</h2>
      <div class="grid2">
        <label class="f">Invoice no.<input id="iNo" autocomplete="off"></label>
        <label class="f">Date<input id="iDate" type="date"></label>
      </div>
      <div class="row-flex">
        <label class="toggle"><input type="checkbox" id="iIncl"> Prices include GST</label>
        <label class="toggle"><input type="checkbox" id="iInter"> Inter-state (IGST)</label>
        <label class="toggle"><input type="checkbox" id="iPaid"> Payment received</label>
      </div>
    </div>

    <div class="card">
      <h2>Bill to</h2>
      <div class="grid2">
        <label class="f full">Customer name<input id="cName" list="custList" autocomplete="off" placeholder="Type or pick a saved customer"></label>
        <label class="f full">Address<textarea id="cAddr" rows="2"></textarea></label>
        <label class="f">GSTIN<input id="cGst" autocomplete="off" placeholder="Optional" style="text-transform:uppercase"><span class="hint" id="gstHint"></span></label>
        <label class="f">Phone<input id="cPhone" type="tel" inputmode="tel" placeholder="For WhatsApp"></label>
      </div>
      <datalist id="custList"></datalist>
    </div>

    <div class="card">
      <h2>Items <span class="sub" id="itemCount" style="font-family:inherit;font-weight:500;font-size:13px;color:var(--muted)"></span></h2>
      <div class="items" id="items"></div>
      <button class="btn add-row" id="bAdd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Add item</button>
      <div class="quick" id="quick"></div>
      <datalist id="prodList"></datalist>
    </div>

    <div class="card">
      <h2>Notes on this invoice</h2>
      <label class="f"><textarea id="iNote" rows="2" placeholder="Optional, e.g. Vehicle no., site name, delivery details"></textarea></label>
    </div>

    <div class="card totals hide-sm" id="deskTotals">
      <div><div class="sub">Total payable</div><div class="big" id="tBig">₹0</div></div>
      <div class="sub" id="tSub" style="margin-left:auto;text-align:right"></div>
    </div>
  </section>

  <section class="preview">
    <div class="preview-inner">
      <div class="sheet-wrap" id="sheetWrap"><div class="pages" id="pages"></div></div>
    </div>
  </section>
</main>

<div class="mobile-bar">
  <div class="totals"><div><div class="sub" id="mSub">Total</div><div class="big" id="mBig">₹0</div></div></div>
  <button class="btn" id="mWa" aria-label="Share on WhatsApp">WhatsApp</button>
  <button class="btn" id="mSave">Save</button>
  <button class="btn primary" id="mPrint">PDF</button>
</div>

<dialog id="dHist">
  <div class="dlg-head"><h3>Saved invoices</h3><button class="btn ghost" data-close>Close</button></div>
  <div class="dlg-body">
    <div class="grid2">
      <label class="f">Search<input id="hSearch" placeholder="Customer or invoice no."></label>
      <label class="f">Month<input id="hMonth" type="month"></label>
    </div>
    <div class="month" id="hStats"></div>
    <div class="hist-list" id="hList"></div>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <button class="btn" id="bCsv">Download month as CSV</button>
      <button class="btn" id="bBackup">Download full backup</button>
      <label class="btn">Restore backup<input type="file" id="fRestore" accept=".json,application/json" hidden></label>
    </div>
    <div class="hint">Everything is stored in this browser only. Download a backup now and then so nothing is lost if browser data is cleared.</div>
  </div>
</dialog>

<dialog id="dSet">
  <div class="dlg-head"><h3>Shop settings</h3><button class="btn ghost" data-close>Close</button></div>
  <div class="dlg-body">
    <div class="grid2">
      <label class="f">Shop name<input data-s="name"></label>
      <label class="f">Tagline<input data-s="tagline"></label>
      <label class="f full">Address<input data-s="address"></label>
      <label class="f">Phone<input data-s="phone"></label>
      <label class="f">Email<input data-s="email"></label>
      <label class="f">GSTIN<input data-s="gstin" style="text-transform:uppercase"></label>
      <label class="f">UPI ID (adds a pay QR)<input data-s="upi" placeholder="e.g. shopname@okhdfcbank"></label>
      <label class="f">Bank name<input data-s="bank"></label>
      <label class="f">Account no.<input data-s="acno"></label>
      <label class="f">IFSC<input data-s="ifsc"></label>
      <label class="f">Default GST rate %<select data-s="defRate"><option>2.5</option><option>5</option><option>12</option><option>18</option><option>28</option></select></label>
      <label class="f">Invoice prefix<input data-s="prefix"></label>
      <label class="f">Next invoice number<input data-s="nextNo" type="number" min="1"></label>
      <label class="f full">Payment terms (one per line)<textarea data-s="terms" rows="4"></textarea></label>
    </div>
    <div class="hint">Changes save automatically.</div>
  </div>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const RATES = [2.5,5,12,18,28];
const RATE_COLOR = {0:'#7A8494',2.5:'#7B5EA7',5:'#3F8F5A',12:'#C9971A',18:'#2B4F8F',28:'#A8342F'};

const store = {
  get(k, d){ try{ const v = localStorage.getItem('mt.'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('mt.'+k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};

const DEFAULT_SETTINGS = {
  name:'Maruti Traders, Bundi', tagline:'Birla Opus Authorised Dealer',
  address:'Dadawari-3, Silore Road, Bundi', phone:'9252171612', email:'marutitradersbundi@gmail.com',
  gstin:'08ABBPG7808C1Z0', bank:'HDFC Bank Ltd', acno:'50200113128511', ifsc:'HDFC0002673', upi:'',
  defRate:'18', prefix:'SP-', nextNo:19,
  terms:'Payment is due within 7 days of the invoice date.\nAccepted payment methods: Bank transfer, UPI, Cash.\nThank you for your business.\nComputer generated invoice, signature not required.'
};
const SEED_CUSTOMERS = [{name:'Ashutosh Chawal Udyog', addr:'15 B.C.R., Industrial Area, Bundi, Rajasthan 323001', gst:'08AAWFA9901A1ZE', phone:''}];
const SEED_CATALOG = [
  {name:'Silver Paint - 20L', price:5100, rate:18, hsn:'', uses:1},
  {name:'Silver Paste - 2kg', price:2100, rate:18, hsn:'', uses:1},
  {name:'Brush 4"', price:100, rate:18, hsn:'', uses:1},
  {name:'Color Fresh TP - 20L', price:2000, rate:18, hsn:'', uses:1}
];

let S = Object.assign({}, DEFAULT_SETTINGS, store.get('settings', {}));
let invoices = store.get('invoices', []);
let customers = store.get('customers', SEED_CUSTOMERS);
let catalog = store.get('catalog', SEED_CATALOG);
let inv = store.get('draft', null) || blankInvoice();

function today(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function blankItem(){ return {name:'', qty:1, price:'', rate:+S.defRate, hsn:''}; }
function blankInvoice(){
  return {no: S.prefix + S.nextNo, date: today(), incl:true, inter:false, paid:false,
    cust:{name:'',addr:'',gst:'',phone:''}, items:[blankItem()], note:''};
}

/* ---------- Maths ---------- */
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const fmt = n => n.toLocaleString('en-IN',{minimumFractionDigits:2, maximumFractionDigits:2});
const fmt0 = n => '₹' + Math.round(n).toLocaleString('en-IN');

function calc(v){
  const lines = v.items.filter(it => it.name || +it.price).map(it => {
    const q = +it.qty || 0, p = +it.price || 0, r = +it.rate || 0;
    const unit = v.incl ? p / (1 + r/100) : p;
    return {...it, q, r, unit: r2(unit), amt: r2(q * unit)};
  });
  const groups = {};
  lines.forEach(l => { (groups[l.r] ||= {rate:l.r, taxable:0}).taxable += l.amt; });
  const tax = Object.values(groups).sort((a,b)=>a.rate-b.rate).map(g => {
    g.taxable = r2(g.taxable);
    if (v.inter) { g.igst = r2(g.taxable * g.rate/100); g.cgst = g.sgst = 0; }
    else { g.cgst = r2(g.taxable * g.rate/200); g.sgst = g.cgst; g.igst = 0; }
    return g;
  });
  const taxable = r2(lines.reduce((s,l)=>s+l.amt,0));
  const cgst = r2(tax.reduce((s,g)=>s+g.cgst,0)), sgst = r2(tax.reduce((s,g)=>s+g.sgst,0)), igst = r2(tax.reduce((s,g)=>s+g.igst,0));
  const gross = r2(taxable + cgst + sgst + igst);
  const total = Math.round(gross);
  return {lines, tax, taxable, cgst, sgst, igst, gross, total, roundOff: r2(total - gross)};
}

function inWords(n){
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two = n => n<20 ? a[n] : b[Math.floor(n/10)] + (n%10 ? ' '+a[n%10] : '');
  const three = n => { const h=Math.floor(n/100), r=n%100; return (h ? a[h]+' Hundred'+(r?' ':'') : '') + (r ? two(r) : ''); };
  function w(n){
    if (n===0) return '';
    const cr=Math.floor(n/1e7), lk=Math.floor(n/1e5)%100, th=Math.floor(n/1e3)%100, rest=n%1000;
    return [cr ? w(cr)+' Crore' : '', lk ? two(lk)+' Lakh' : '', th ? two(th)+' Thousand' : '', rest ? three(rest) : ''].filter(Boolean).join(' ');
  }
  return n === 0 ? 'Rupees Zero Only' : 'Rupees ' + w(n) + ' Only';
}

const GST_RE = /^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl = s => esc(s).replace(/\n/g,'<br>');
const dmy = iso => { if(!iso) return ''; const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`; };

/* ---------- Editor ---------- */
function bindInvoiceFields(){
  $('#iNo').value = inv.no; $('#iDate').value = inv.date;
  $('#iIncl').checked = inv.incl; $('#iInter').checked = inv.inter; $('#iPaid').checked = inv.paid;
  $('#cName').value = inv.cust.name; $('#cAddr').value = inv.cust.addr; $('#cGst').value = inv.cust.gst; $('#cPhone').value = inv.cust.phone;
  $('#iNote').value = inv.note;
  gstHint();
}
function gstHint(){
  const g = inv.cust.gst.trim().toUpperCase(), h = $('#gstHint');
  if (!g) { h.textContent=''; h.className='hint'; return; }
  if (!GST_RE.test(g)) { h.textContent = 'This doesn\'t look like a valid 15-character GSTIN.'; h.className='hint warn'; return; }
  const inter = g.slice(0,2) !== S.gstin.slice(0,2);
  h.textContent = inter ? 'Other state: IGST applies.' : 'Same state: CGST + SGST.'; h.className='hint';
}

const trashSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';
function renderItems(){
  const box = $('#items'); box.innerHTML = '';
  inv.items.forEach((it, i) => {
    const el = document.createElement('div');
    el.className = 'it'; el.style.borderLeftColor = RATE_COLOR[it.rate] || RATE_COLOR[0];
    el.innerHTML = `
      <div class="name"><input data-k="name" list="prodList" placeholder="Item ${i+1}, e.g. Silver Paint - 20L" value="${esc(it.name)}" aria-label="Item name">
        <button class="icon-btn" data-del aria-label="Remove item">${trashSvg}</button></div>
      <label><small>Qty</small><input data-k="qty" type="number" min="0" step="any" inputmode="decimal" value="${esc(it.qty)}"></label>
      <label><small>${inv.incl ? 'Rate incl. GST' : 'Rate excl. GST'}</small><input data-k="price" type="number" min="0" step="any" inputmode="decimal" value="${esc(it.price)}" placeholder="₹"></label>
      <div class="rates">${RATES.map(r => `<button class="chip" data-rate="${r}" aria-pressed="${+it.rate===r}"><i style="background:${RATE_COLOR[r]}"></i>${r}%</button>`).join('')}
        <span class="line-amt" data-amt></span></div>`;
    el.addEventListener('input', e => {
      const k = e.target.dataset.k; if (!k) return;
      it[k] = e.target.value;
      update();
    });
    el.querySelector('[data-k="name"]').addEventListener('change', e => {
      const p = catalog.find(c => c.name.toLowerCase() === e.target.value.trim().toLowerCase());
      if (p) { it.name = p.name; it.price = p.price; it.rate = p.rate; it.hsn = p.hsn || ''; renderItems(); update(); }
    });
    el.querySelector('[data-del]').onclick = () => { inv.items.splice(i,1); if(!inv.items.length) inv.items.push(blankItem()); renderItems(); update(); };
    el.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => { it.rate = +b.dataset.rate; renderItems(); update(); });
    box.appendChild(el);
  });
  updateLineAmounts();
}
function updateLineAmounts(){
  const nodes = document.querySelectorAll('#items .it');
  inv.items.forEach((it, i) => {
    const q=+it.qty||0, p=+it.price||0;
    const n = nodes[i] && nodes[i].querySelector('[data-amt]');
    if (n) n.textContent = p ? '₹' + fmt(q*p) + (inv.incl ? '' : ' + GST') : '';
  });
  const filled = inv.items.filter(it=>it.name||+it.price).length;
  $('#itemCount').textContent = filled ? `${filled} item${filled>1?'s':''}` : '';
}
function renderQuick(){
  const top = [...catalog].sort((a,b)=>(b.uses||0)-(a.uses||0)).slice(0,8);
  $('#quick').innerHTML = top.map((p,i)=>`<button class="chip" data-q="${i}"><i style="background:${RATE_COLOR[p.rate]||RATE_COLOR[0]}"></i>${esc(p.name)}</button>`).join('');
  $('#quick').querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
    const p = top[+b.dataset.q];
    const existing = inv.items.find(it => it.name === p.name);
    if (existing) existing.qty = (+existing.qty||0) + 1;
    else {
      const empty = inv.items.find(it => !it.name && !+it.price);
      const target = empty || (inv.items.push(blankItem()), inv.items[inv.items.length-1]);
      Object.assign(target, {name:p.name, price:p.price, rate:p.rate, hsn:p.hsn||'', qty:1});
    }
    renderItems(); update();
  });
  $('#prodList').innerHTML = catalog.map(p=>`<option value="${esc(p.name)}">₹${p.price} · ${p.rate}% GST</option>`).join('');
  $('#custList').innerHTML = customers.map(c=>`<option value="${esc(c.name)}">`).join('');
}

/* ---------- Preview ---------- */
let qrTimer;
const PAGE_H = 1123; // A4 height at 96 dpi
function renderSheet(){
  const c = calc(inv);
  const stripe = RATES.map(r=>`<i style="background:${RATE_COLOR[r]}"></i>`).join('');
  const taxRows = inv.inter
    ? c.tax.filter(g=>g.rate).map(g=>`<tr><td>IGST ${g.rate}%</td><td class="n">${fmt(g.igst)}</td></tr>`).join('')
    : c.tax.filter(g=>g.rate).map(g=>`<tr><td>CGST ${g.rate/2}%</td><td class="n">${fmt(g.cgst)}</td></tr><tr><td>SGST ${g.rate/2}%</td><td class="n">${fmt(g.sgst)}</td></tr>`).join('');
  const terms = S.terms.split('\n').filter(t=>t.trim());
  const showQr = S.upi && !inv.paid && c.total > 0;

  const header = `
    <div class="inv-stripe">${stripe}</div>
    <div class="inv-top"><div>GSTIN: <b>${esc(S.gstin)}</b></div><div class="c inv-title">TAX INVOICE</div><div class="r">${esc(S.phone)}</div></div>
    <div class="inv-meta"><div>Invoice No: <b>${esc(inv.no)}</b></div><div>Date: <b>${dmy(inv.date)}</b></div></div>
    <div class="inv-parties">
      <div>
        <div class="shop-name">${esc(S.name)}</div>
        <div class="shop-tag">${esc(S.tagline)}</div>
        <div>${esc(S.address)}</div><div>${esc(S.phone)}</div><div>${esc(S.email)}</div>
        <div class="bank"><b>Bank details</b><br>${esc(S.bank)}<br>A/c No: ${esc(S.acno)}<br>IFSC: ${esc(S.ifsc)}</div>
      </div>
      <div>
        <div class="lbl">Bill to</div>
        <div class="cust-name">${esc(inv.cust.name) || '<span style="color:#aaa">Customer name</span>'}</div>
        <div>${nl(inv.cust.addr)}</div>
        ${inv.cust.gst ? `<div style="margin-top:6px">GSTIN: <b>${esc(inv.cust.gst.toUpperCase())}</b></div>` : ''}
        ${inv.cust.phone ? `<div>Ph: ${esc(inv.cust.phone)}</div>` : ''}
        ${inv.note ? `<div style="margin-top:8px;font-size:12px;color:#444">${nl(inv.note)}</div>` : ''}
      </div>
    </div>
`;
  const table = `
    <table class="inv-table">
      <thead><tr><th style="width:44px">S.No</th><th>Particulars</th><th class="n">GST</th><th class="n">Qty</th><th class="n">Unit price (₹)</th><th class="n">Amount (₹)</th></tr></thead>
      <tbody></tbody>
    </table>`;
  const compact = `
    <div class="inv-stripe">${stripe}</div>
    <div class="inv-mini">
      <div><div class="shop-name">${esc(S.name)}</div><div class="mini-sub">GSTIN: ${esc(S.gstin)}</div></div>
      <div class="c"><div class="inv-title">TAX INVOICE</div><div class="mini-sub">continued</div></div>
      <div class="r">Invoice No: <b>${esc(inv.no)}</b><br>Date: <b>${dmy(inv.date)}</b><br>Bill to: <b>${esc(inv.cust.name)}</b></div>
    </div>`;
  const bottom = `
    <div class="inv-bottom">
      <div>
        <div class="words"><b>Amount in words:</b><br>${inWords(c.total)}</div>
        <div class="notes"><h4>Payment terms and notes</h4><ul>${terms.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>
        ${showQr ? `<div class="qr"><div id="qrBox"></div><div><b>Scan to pay ${fmt0(c.total)}</b><br>UPI: ${esc(S.upi)}</div></div>` : ''}
      </div>
      <table class="sum">
        <tr><td>Taxable amount</td><td class="n">${fmt(c.taxable)}</td></tr>
        ${taxRows}
        ${c.roundOff ? `<tr class="muted"><td>Round off</td><td class="n">${c.roundOff>0?'+':''}${fmt(c.roundOff)}</td></tr>` : ''}
        <tr class="grand"><td>Total (₹)</td><td class="n">${fmt(c.total)}</td></tr>
      </table>
    </div>`;
  const rows = c.lines.length
    ? c.lines.map((l,i)=>`<tr><td>${String(i+1).padStart(2,'0')}</td><td>${esc(l.name)}</td><td class="n"><span class="rate-dot" style="background:${RATE_COLOR[l.r]||'#999'}"></span>${l.r}%</td><td class="n">${l.q}</td><td class="n">${fmt(l.unit)}</td><td class="n">${fmt(l.amt)}</td></tr>`)
    : [`<tr><td colspan="6" style="text-align:center;color:#aaa;padding:30px">Add items to see them here</td></tr>`];

  // Lay out pages: fill each A4 page with rows, then put the totals block on the last page.
  const host = $('#pages'); host.innerHTML = '';
  document.body.classList.add('measuring'); // preview may be hidden on phones; lay out off-screen
  const pages = [];
  const newPage = () => {
    const first = !pages.length;
    const el = document.createElement('div');
    el.className = 'sheet';
    el.innerHTML = `<div class="page-body">${first ? header : compact}${table}</div><div class="inv-foot"><span>${esc(S.name)} &nbsp;|&nbsp; ${esc(S.address)} &nbsp;|&nbsp; ${esc(S.phone)}</span><span class="pg"></span></div>`;
    host.appendChild(el);
    const p = {el, body: el.querySelector('.page-body'), tbody: el.querySelector('tbody')};
    pages.push(p); return p;
  };
  const LIMIT = PAGE_H - 70; // keep clear of the footer
  const overflows = p => p.body.offsetTop + p.body.offsetHeight > LIMIT;
  let page = newPage();
  rows.forEach(html => {
    page.tbody.insertAdjacentHTML('beforeend', html);
    if (overflows(page) && page.tbody.rows.length > 1) {
      const tr = page.tbody.lastElementChild; tr.remove();
      page = newPage(); page.tbody.appendChild(tr);
    }
  });
  page.body.insertAdjacentHTML('beforeend', bottom);
  if (overflows(page)) {
    // Totals don't fit: carry the last item over so the totals page still shows an item row.
    const block = page.body.querySelector('.inv-bottom'); block.remove();
    const carry = page.tbody.rows.length > 1 ? page.tbody.lastElementChild : null;
    page = newPage();
    if (carry) page.tbody.appendChild(carry); else page.body.querySelector('.inv-table').remove();
    page.body.appendChild(block);
  }
  pages.forEach((p, i) => {
    if (pages.length > 1) {
      p.el.querySelector('.pg').textContent = `Page ${i+1} of ${pages.length}`;
      if (i < pages.length - 1) p.body.insertAdjacentHTML('beforeend', '<div class="cont">Continued on next page</div>');
    }
  });
  document.body.classList.remove('measuring');
  if (inv.paid) page.el.insertAdjacentHTML('beforeend', '<div class="stamp">PAID</div>');

  if (showQr) {
    clearTimeout(qrTimer);
    qrTimer = setTimeout(() => {
      const box = document.getElementById('qrBox');
      if (!box || !window.QRCode) return;
      const url = `upi://pay?pa=${encodeURIComponent(S.upi)}&pn=${encodeURIComponent(S.name)}&am=${c.total}&cu=INR&tn=${encodeURIComponent(inv.no)}`;
      new QRCode(box, {text:url, width:184, height:184, correctLevel:QRCode.CorrectLevel.M});
    }, 150);
  }

  $('#tBig').textContent = $('#mBig').textContent = fmt0(c.total);
  const taxSum = c.cgst + c.sgst + c.igst;
  $('#tSub').innerHTML = `Taxable ₹${fmt(c.taxable)}<br>GST ₹${fmt(taxSum)}`;
  $('#mSub').textContent = `incl. GST ₹${fmt(taxSum)}` + (pages.length > 1 ? `, ${pages.length} pages` : '');
  fitSheet();
}
function fitSheet(){
  const wrap = $('#sheetWrap'), host = $('#pages');
  const w = wrap.clientWidth; if (!w) return;
  const s = Math.min(1, w / 794);
  host.style.transform = `scale(${s})`;
  wrap.style.height = (host.offsetHeight * s) + 'px';
}

function update(){
  updateLineAmounts();
  renderSheet();
  store.set('draft', inv);
}

/* ---------- Actions ---------- */
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }
function numOf(no){ const m = String(no).match(/(\d+)\s*$/); return m ? +m[1] : 0; }

function saveInvoice(){
  const c = calc(inv);
  if (!inv.cust.name.trim()) { toast('Add a customer name before saving'); $('#cName').focus(); return false; }
  if (!c.lines.length) { toast('Add at least one item before saving'); return false; }
  const rec = JSON.parse(JSON.stringify(inv));
  rec.items = rec.items.filter(it => it.name || +it.price);
  rec.total = c.total; rec.taxable = c.taxable; rec.cgst = c.cgst; rec.sgst = c.sgst; rec.igst = c.igst; rec.savedAt = Date.now();
  const i = invoices.findIndex(x => x.no === rec.no);
  if (i >= 0) invoices[i] = rec; else invoices.unshift(rec);
  store.set('invoices', invoices);

  // Remember customer
  const cu = {name:inv.cust.name.trim(), addr:inv.cust.addr, gst:inv.cust.gst.toUpperCase(), phone:inv.cust.phone};
  const ci = customers.findIndex(x => x.name.toLowerCase() === cu.name.toLowerCase());
  if (ci >= 0) customers[ci] = cu; else customers.push(cu);
  store.set('customers', customers);

  // Remember products & latest prices
  rec.items.forEach(it => {
    if (!it.name.trim()) return;
    const p = catalog.find(x => x.name.toLowerCase() === it.name.trim().toLowerCase());
    if (p) { p.price = +it.price; p.rate = +it.rate; p.hsn = it.hsn; if (i < 0) p.uses = (p.uses||0)+1; }
    else catalog.push({name:it.name.trim(), price:+it.price, rate:+it.rate, hsn:it.hsn, uses:1});
  });
  store.set('catalog', catalog);

  const n = numOf(inv.no);
  if (n >= +S.nextNo) { S.nextNo = n + 1; store.set('settings', S); }
  renderQuick();
  toast(i >= 0 ? `Invoice ${inv.no} updated` : `Invoice ${inv.no} saved`);
  return true;
}

function newInvoice(){
  inv = blankInvoice(); bindInvoiceFields(); renderItems(); update();
  window.scrollTo({top:0, behavior:'smooth'});
  toast(`Started ${inv.no}`);
}

function printInvoice(){
  const prev = document.title;
  document.title = `${inv.no} ${inv.cust.name}`.trim();
  const wasHidden = !document.body.classList.contains('show-preview');
  window.print();
  document.title = prev;
}

function whatsapp(){
  const c = calc(inv);
  const lines = c.lines.map(l => `• ${l.name} × ${l.q}`).join('\n');
  const msg = `*${S.name}*\nTax Invoice ${inv.no} dated ${dmy(inv.date)}\n\n${lines}\n\nTaxable: ₹${fmt(c.taxable)}\nGST: ₹${fmt(c.cgst+c.sgst+c.igst)}\n*Total: ${fmt0(c.total)}*\n\n${S.upi ? 'UPI: '+S.upi+'\n' : ''}Bank: ${S.bank}, A/c ${S.acno}, IFSC ${S.ifsc}\n\nThank you!`;
  let ph = (inv.cust.phone||'').replace(/\D/g,'');
  if (ph.length === 10) ph = '91' + ph;
  window.open(`https://wa.me/${ph}?text=${encodeURIComponent(msg)}`, '_blank');
}

/* ---------- History ---------- */
function renderHistory(){
  const q = $('#hSearch').value.trim().toLowerCase(), m = $('#hMonth').value;
  const inMonth = invoices.filter(x => !m || (x.date||'').startsWith(m));
  const list = inMonth.filter(x => !q || x.no.toLowerCase().includes(q) || (x.cust.name||'').toLowerCase().includes(q))
    .sort((a,b) => (b.date||'').localeCompare(a.date||'') || numOf(b.no)-numOf(a.no));
  const sum = k => r2(inMonth.reduce((s,x)=>s+(+x[k]||0),0));
  $('#hStats').innerHTML = [
    ['Invoices', inMonth.length],['Taxable','₹'+fmt(sum('taxable'))],['CGST','₹'+fmt(sum('cgst'))],['SGST','₹'+fmt(sum('sgst'))],
    ...(sum('igst') ? [['IGST','₹'+fmt(sum('igst'))]] : []), ['Total billed', fmt0(sum('total'))],
    ['Unpaid', fmt0(inMonth.filter(x=>!x.paid).reduce((s,x)=>s+x.total,0))]
  ].map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('');
  $('#hList').innerHTML = list.length ? list.map(x => `
    <div class="hist-row">
      <div class="no"><b>${esc(x.no)}</b></div>
      <div class="who"><b>${esc(x.cust.name)}</b><span>${dmy(x.date)} &nbsp;<span class="pill ${x.paid?'paid':''}">${x.paid?'Paid':'Due'}</span></span></div>
      <div class="amt">${fmt0(x.total)}</div>
      <div class="hist-actions">
        <button class="btn" data-open="${esc(x.no)}">Open</button>
        <button class="btn ghost" data-copy="${esc(x.no)}" title="Same items, new number">Repeat</button>
        <button class="icon-btn" data-delh="${esc(x.no)}" aria-label="Delete ${esc(x.no)}">${trashSvg}</button>
      </div>
    </div>`).join('')
    : `<div class="empty">${invoices.length ? 'No invoices match this search.' : 'Saved invoices appear here. Fill one in and press Save.'}</div>`;
  $('#hList').querySelectorAll('[data-open]').forEach(b => b.onclick = () => {
    inv = JSON.parse(JSON.stringify(invoices.find(x=>x.no===b.dataset.open)));
    if (!inv.items.length) inv.items.push(blankItem());
    bindInvoiceFields(); renderItems(); update(); $('#dHist').close(); toast(`Opened ${inv.no}`);
  });
  $('#hList').querySelectorAll('[data-copy]').forEach(b => b.onclick = () => {
    const src = JSON.parse(JSON.stringify(invoices.find(x=>x.no===b.dataset.copy)));
    inv = Object.assign(blankInvoice(), {cust:src.cust, items:src.items, incl:src.incl, inter:src.inter});
    bindInvoiceFields(); renderItems(); update(); $('#dHist').close(); toast(`New invoice ${inv.no} with the same items`);
  });
  $('#hList').querySelectorAll('[data-delh]').forEach(b => b.onclick = () => {
    if (!confirm(`Delete invoice ${b.dataset.delh}? This can't be undone.`)) return;
    invoices = invoices.filter(x => x.no !== b.dataset.delh); store.set('invoices', invoices); renderHistory();
  });
}
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function exportCsv(){
  const m = $('#hMonth').value;
  const rows = invoices.filter(x => !m || (x.date||'').startsWith(m)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const q = s => `"${String(s??'').replace(/"/g,'""')}"`;
  const csv = ['Invoice No,Date,Customer,Customer GSTIN,Taxable,CGST,SGST,IGST,Total,Status']
    .concat(rows.map(x => [q(x.no), dmy(x.date), q(x.cust.name), q(x.cust.gst), x.taxable, x.cgst, x.sgst, x.igst, x.total, x.paid?'Paid':'Due'].join(','))).join('\n');
  download(`invoices-${m||'all'}.csv`, csv, 'text/csv');
}

/* ---------- Settings ---------- */
function bindSettings(){
  document.querySelectorAll('[data-s]').forEach(el => {
    el.value = S[el.dataset.s] ?? '';
    el.oninput = () => {
      S[el.dataset.s] = el.dataset.s === 'gstin' ? el.value.toUpperCase() : el.value;
      store.set('settings', S); $('#brandName').textContent = S.name.split(',')[0]; gstHint(); renderSheet();
    };
  });
}

/* ---------- Wire up ---------- */
const fieldMap = {iNo:['no'], iDate:['date'], iNote:['note'], cName:['cust','name'], cAddr:['cust','addr'], cGst:['cust','gst'], cPhone:['cust','phone']};
Object.entries(fieldMap).forEach(([id, path]) => {
  $('#'+id).addEventListener('input', e => {
    if (path.length === 1) inv[path[0]] = e.target.value; else inv[path[0]][path[1]] = e.target.value;
    if (id === 'cGst') {
      const g = e.target.value.trim().toUpperCase();
      if (GST_RE.test(g)) { inv.inter = g.slice(0,2) !== S.gstin.slice(0,2); $('#iInter').checked = inv.inter; }
      gstHint();
    }
    update();
  });
});
$('#cName').addEventListener('change', e => {
  const cu = customers.find(c => c.name.toLowerCase() === e.target.value.trim().toLowerCase());
  if (!cu) return;
  inv.cust = {...cu}; bindInvoiceFields();
  if (GST_RE.test(cu.gst)) { inv.inter = cu.gst.slice(0,2) !== S.gstin.slice(0,2); $('#iInter').checked = inv.inter; }
  update();
});
$('#iIncl').onchange = e => { inv.incl = e.target.checked; renderItems(); update(); };
$('#iInter').onchange = e => { inv.inter = e.target.checked; update(); };
$('#iPaid').onchange = e => { inv.paid = e.target.checked; update(); };
$('#bAdd').onclick = () => { inv.items.push(blankItem()); renderItems(); update(); const all=document.querySelectorAll('#items [data-k="name"]'); all[all.length-1].focus(); };

$('#bNew').onclick = newInvoice;
$('#bReset').onclick = () => {
  if (!confirm('Clear the customer, items and notes on this invoice?')) return;
  const no = inv.no, date = inv.date;
  inv = Object.assign(blankInvoice(), {no, date});
  bindInvoiceFields(); renderItems(); update(); toast('Invoice cleared');
};
$('#bSave').onclick = $('#mSave').onclick = saveInvoice;
$('#bPrint').onclick = $('#mPrint').onclick = printInvoice;
$('#bWa').onclick = $('#mWa').onclick = whatsapp;
$('#bHist').onclick = () => { if (!$('#hMonth').value) $('#hMonth').value = today().slice(0,7); renderHistory(); $('#dHist').showModal(); };
$('#bSet').onclick = () => { bindSettings(); $('#dSet').showModal(); };
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());
$('#hSearch').oninput = renderHistory; $('#hMonth').oninput = renderHistory;
$('#bCsv').onclick = exportCsv;
$('#bBackup').onclick = () => download(`maruti-invoices-backup-${today()}.json`, JSON.stringify({settings:S, invoices, customers, catalog}, null, 1), 'application/json');
$('#fRestore').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.invoices)) throw 0;
    if (!confirm(`Restore ${d.invoices.length} invoices from this backup? Current saved data will be replaced.`)) return;
    S = Object.assign({}, DEFAULT_SETTINGS, d.settings); invoices = d.invoices; customers = d.customers || []; catalog = d.catalog || [];
    ['settings','invoices','customers','catalog'].forEach(k => store.set(k, {settings:S, invoices, customers, catalog}[k]));
    renderQuick(); renderHistory(); renderSheet(); toast('Backup restored');
  } catch(err) { toast('That file is not an invoice backup'); }
  e.target.value = '';
};
document.querySelectorAll('.mtabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.mtabs button').forEach(x => x.setAttribute('aria-selected', x===b));
  document.body.classList.toggle('show-preview', b.dataset.tab === 'preview');
  fitSheet();
});
document.addEventListener('keydown', e => {
  if ((e.metaKey||e.ctrlKey) && e.key === 's') { e.preventDefault(); saveInvoice(); }
  if ((e.metaKey||e.ctrlKey) && e.key === 'p') { e.preventDefault(); printInvoice(); }
});
window.addEventListener('resize', fitSheet);
window.addEventListener('afterprint', fitSheet);
window.addEventListener('beforeprint', () => { $('#pages').style.transform='none'; });

$('#brandName').textContent = S.name.split(',')[0];
bindInvoiceFields(); renderItems(); renderQuick(); update();
document.fonts && document.fonts.ready.then(renderSheet);
window.addEventListener('load', () => renderSheet());
</script>
</body>
</html>
